<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title }}</title>

  <style>
    body {
      max-width: 800px;
      margin: 40px auto;
      padding: 0 20px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      line-height: 1.6;
      color: #24292f;
    }

    img {
      max-width: 100%;
      height: auto;
    }

    a {
      color: #0969da;
    }

    code {
      background: #f6f8fa;
      padding: 2px 5px;
      border-radius: 4px;
    }

    pre {
      background: #f6f8fa;
      padding: 16px;
      overflow-x: auto;
      border-radius: 6px;
    }

    h1, h2, h3 {
      line-height: 1.25;
    }

    .carousel {
    margin: 2rem 0;
    text-align: center;
    }

    .carousel img {
    display: block;
    max-width: 100%;
    max-height: 600px;
    width: auto;
    height: auto;
    margin: 0 auto 1rem;
    border-radius: 6px;
    }

    .carousel-controls {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 1rem;
    }

    .carousel-controls button {
    border: none;
    background: transparent;
    color: #57606a;
    font-size: 1.4rem;
    cursor: pointer;
    padding: 0.2rem 0.5rem;
    }

    .carousel-controls button:hover {
    color: #0969da;
    }

    #carousel-counter {
    font-size: 0.85rem;
    color: #6e7781;
    min-width: 3rem;
    }
  </style>
</head>

<body>
  {{ content }}
</body>
</html>
