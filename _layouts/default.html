<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title }}</title>

  <style>
    body {
      max-width: 800px;
      margin: 40px auto;
      padding: 0 20px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      line-height: 1.6;
      color: #24292f;
    }

    img {
      max-width: 100%;
      height: auto;
    }

    a {
      color: #0969da;
    }

    code {
      background: #f6f8fa;
      padding: 2px 5px;
      border-radius: 4px;
    }

    pre {
      background: #f6f8fa;
      padding: 16px;
      overflow-x: auto;
      border-radius: 6px;
    }

    h1, h2, h3 {
      line-height: 1.25;
    }
  </style>
</head>

<body>
  {{ content }}
</body>
</html>
